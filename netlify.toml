[build]
  base = "website"
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Language routes are client-side: every /en and /fr path serves the single page.
[[redirects]]
  from = "/"
  to = "/en/"
  status = 302

[[redirects]]
  from = "/en"
  to = "/en/"
  status = 301

[[redirects]]
  from = "/fr"
  to = "/fr/"
  status = 301

[[redirects]]
  from = "/en/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/fr/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
